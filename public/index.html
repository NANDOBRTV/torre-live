<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090a12"><title>Torre Live — Batalha da Live</title><script src="/socket.io/socket.io.js"></script>
<style>
:root{--r:#ff343d;--b:#00bfff;--g:#19f58a}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080910;color:white;font-family:system-ui,Arial,sans-serif}button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}.game{position:relative;width:100%;height:100dvh;min-height:540px;max-width:760px;margin:auto;overflow:hidden;background:linear-gradient(90deg,#42171e,#21151f 49.6%,#101b30 50.4%,#10243e)}.game:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 25% 40%,#ff55551b,transparent 48%),radial-gradient(ellipse at 75% 40%,#16bfff22,transparent 48%),radial-gradient(#ffffff36 .7px,transparent 1px);background-size:auto,auto,71px 71px}.split{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#ffffff20}.city{position:absolute;left:0;right:0;bottom:24%;height:19%;opacity:.7;background:#09101e;clip-path:polygon(0 90%,4% 90%,4% 52%,7% 52%,7% 70%,11% 70%,11% 30%,14% 30%,14% 62%,18% 62%,18% 45%,21% 45%,21% 78%,26% 78%,26% 15%,29% 15%,29% 66%,34% 66%,34% 40%,39% 40%,39% 80%,44% 80%,44% 55%,48% 55%,48% 100%,0 100%)}.city.right{transform:scaleX(-1);background:#061a2b}.floor{position:absolute;bottom:0;height:30%;width:100%;background:repeating-linear-gradient(0deg,#ff3b4425 0 2px,transparent 2px 31px)}.floor:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 12%,#ff4a5120 12.2% 12.5%,transparent 12.7% 24%);transform:perspective(140px) rotateX(35deg);transform-origin:bottom}
.status{position:absolute;z-index:8;top:calc(env(safe-area-inset-top,0px) + 13px);left:12px;max-width:calc(100% - 205px);font-size:10px;background:#080910d9;border:1px solid #ffffff28;border-radius:20px;padding:7px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#eee}.status.ok{color:#5dffb0;border-color:#2bd88c}.status.bad{color:#ffb4ba;border-color:#ff5967}.header{position:absolute;top:env(safe-area-inset-top,0px);right:10px;display:flex;gap:9px;z-index:8;padding:8px 0}.round{border:0;border-radius:50%;width:52px;height:52px;background:#080910e8;box-shadow:0 4px 15px #0004;font-size:25px;display:grid;place-items:center}
.scores{position:absolute;z-index:4;top:calc(env(safe-area-inset-top,0px) + 76px);left:12%;right:12%;display:grid;grid-template-columns:1fr 35px 1fr;text-align:center}.name{font-size:clamp(22px,5.5vw,37px);font-weight:1000;letter-spacing:-1px;line-height:1.2;text-shadow:2px 3px #000,-1px -1px #fff}.name.r{color:#ff4148}.name.b{color:#299aff}.score{font-size:clamp(46px,12vw,76px);font-weight:1000;line-height:1.05;letter-spacing:-3px;text-shadow:0 5px #000;font-variant-numeric:tabular-nums}.vs{font-size:clamp(23px,6vw,38px);font-weight:1000;margin-top:41px;text-shadow:0 4px #000}.wins{display:inline-flex;gap:5px;align-items:center;justify-content:center;margin-top:8px;padding:7px 12px;border:1px solid #ffffff70;background:#080910e8;border-radius:24px;font-weight:900;font-size:12px;white-space:nowrap}.rule{position:absolute;top:calc(env(safe-area-inset-top,0px) + 209px);left:0;right:0;text-align:center;z-index:4;font-size:10px;font-weight:800;color:#e4e6ed;text-shadow:0 2px 4px #000}.multi{display:none;position:absolute;top:calc(env(safe-area-inset-top,0px) + 250px);left:35%;right:35%;z-index:4;text-align:center;font-weight:1000;font-size:clamp(22px,5vw,36px);color:#27f78c;text-shadow:2px 3px #064c31,-1px -1px #b9ffd6;white-space:nowrap}.progress{height:6px;margin:5px auto 0;width:min(160px,30vw);border-radius:6px;background:#111;border:1px solid #ffffff50;overflow:hidden}.progress span{display:block;width:30%;height:100%;background:#21e878}
.rails{position:absolute;z-index:5;left:5px;right:5px;top:calc(env(safe-area-inset-top,0px) + 280px);bottom:7%;display:flex;justify-content:space-between;pointer-events:none}.rail{width:62px;display:flex;flex-direction:column;justify-content:space-around;align-items:center;gap:2px}.gift{width:100%;min-height:48px;padding:2px 0;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;text-shadow:0 2px 3px #000;filter:drop-shadow(0 2px 2px #0008)}.emoji{font-size:clamp(27px,7vw,42px);line-height:1.05;filter:drop-shadow(0 1px 1px #000)}.label{font-size:10px;line-height:1.1;font-weight:1000;text-transform:uppercase}.points{font-size:14px;color:var(--g);font-weight:1000;line-height:1.2}.negative .points{color:#ff6875}.gift:active{transform:scale(.9)}
.towers{position:absolute;z-index:3;left:13%;right:13%;bottom:0;height:43%;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}.tower{position:relative;width:31%;height:var(--h,76%);min-height:20%;transition:height .4s;filter:drop-shadow(0 5px 2px #0008)}.tower.r{--face:#ed2633;--side:#9e1020;--top:#ff9b8c}.tower.b{--face:#168edc;--side:#07588e;--top:#8edbff}.blocks{position:absolute;inset:15% 0 0;display:flex;flex-direction:column-reverse;overflow:hidden}.block{flex:1 0 7.5%;background:linear-gradient(90deg,#ffffff22,transparent 30%),var(--face);border:2px solid #11131b;position:relative}.block:after{content:"";position:absolute;right:-12px;top:-2px;bottom:-2px;width:12px;background:var(--side);border:2px solid #11131b;transform:skewY(-32deg);transform-origin:left}.roof{position:absolute;top:0;left:-12%;width:112%;height:18%;background:var(--top);border:3px solid #11131b;transform:skewY(10deg);z-index:2}.tower.b .roof{transform:skewY(-10deg)}.bubbles{position:absolute;inset:0;z-index:7;pointer-events:none;overflow:hidden}.bubble{position:absolute;font-size:30px;animation:floatup 2.6s ease-out forwards;filter:drop-shadow(0 2px 2px #000)}@keyframes floatup{0%{transform:translateY(20px) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-180px) rotate(15deg) scale(1.15);opacity:0}}.feed{position:absolute;z-index:9;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:22%;right:22%;min-height:34px;max-height:70px;border-radius:20px;background:#090b16d9;border:1px solid #ffffff20;display:flex;align-items:center;justify-content:center;padding:7px 10px;text-align:center;font-size:10px;overflow:hidden}
@media(max-height:700px){.scores{top:calc(env(safe-area-inset-top,0px) + 65px)}.rule{top:calc(env(safe-area-inset-top,0px) + 185px)}.multi{top:calc(env(safe-area-inset-top,0px) + 220px)}.rails{top:calc(env(safe-area-inset-top,0px) + 250px);bottom:6%}.towers{height:40%}.emoji{font-size:28px}.label{font-size:9px}.points{font-size:12px}.round{width:45px;height:45px}}@media(min-width:600px){.scores{left:18%;right:18%}.towers{left:20%;right:20%}.rails{left:18px;right:18px}.rail{width:75px}}
</style></head>
<body><main class="game" id="game"><div class="split"></div><div class="city"></div><div class="city right"></div><div class="floor"></div>
<div class="status" id="status">Conectando ao servidor…</div><div class="header"><button class="round" id="viewBtn" aria-label="Visualização">▦</button><button class="round" id="pauseBtn" aria-label="Pausar">Ⅱ</button><button class="round" id="resetBtn" aria-label="Nova rodada">×</button></div>
<section class="scores"><div><div class="name r">CHAT</div><div class="score" id="chatScore">0</div><div class="wins">VITÓRIAS <span id="chatWins">0</span></div></div><div class="vs">VS</div><div><div class="name b">CREATOR</div><div class="score" id="creatorScore">0</div><div class="wins">VITÓRIAS <span id="creatorWins">0</span></div></div></section>
<div class="rule"><span id="timer">10:00</span> • 1 BLOCO = 1 PONTO</div><div class="multi" id="multi">2X TUDO<div class="progress"><span id="progress"></span></div></div>
<div class="rails"><div class="rail">
<button class="gift" data-team="chat" data-points="1" data-emoji="🟦"><span class="emoji">🟦</span><span class="label">FREE GROW</span><span class="points">+1</span></button>
<button class="gift" data-team="chat" data-points="10" data-emoji="🌹"><span class="emoji">🌹</span><span class="label">SUBIR</span><span class="points">+10</span></button>
<button class="gift" data-team="chat" data-points="30" data-emoji="🫶"><span class="emoji">🫶</span><span class="label">SUBIR</span><span class="points">+30</span></button>
<button class="gift negative" data-team="chat" data-points="-20" data-emoji="🍩"><span class="emoji">🍩</span><span class="label">DERRUBAR</span><span class="points">−20</span></button>
<button class="gift" data-team="chat" data-points="25" data-emoji="🪄"><span class="emoji">🪄</span><span class="label">ROUBAR</span><span class="points">+25</span></button>
<button class="gift" data-team="chat" data-points="0" data-emoji="💥"><span class="emoji">💥</span><span class="label">ZERADO!</span></button>
<button class="gift" data-team="chat" data-action="win" data-emoji="🦊"><span class="emoji">🦊</span><span class="label">VITÓRIA</span><span class="points">+1 VITÓRIA</span></button>
<button class="gift negative" data-team="chat" data-action="lose" data-emoji="🎟️"><span class="emoji">🎟️</span><span class="label">TIRAR</span><span class="points">−1 VITÓRIA</span></button></div>
<div class="rail">
<button class="gift" data-team="creator" data-points="1" data-emoji="🟦"><span class="emoji">🟦</span><span class="label">FREE GROW</span><span class="points">+1</span></button>
<button class="gift" data-team="creator" data-points="10" data-emoji="🎵"><span class="emoji">🎵</span><span class="label">SUBIR</span><span class="points">+10</span></button>
<button class="gift" data-team="creator" data-points="30" data-emoji="🍪"><span class="emoji">🍪</span><span class="label">SUBIR</span><span class="points">+30</span></button>
<button class="gift negative" data-team="creator" data-points="-20" data-emoji="🍩"><span class="emoji">🍩</span><span class="label">DERRUBAR</span><span class="points">−20</span></button>
<button class="gift" data-team="creator" data-points="25" data-emoji="👑"><span class="emoji">👑</span><span class="label">ROUBAR</span><span class="points">+25</span></button>
<button class="gift" data-team="creator" data-points="0" data-emoji="💥"><span class="emoji">💥</span><span class="label">ZERADO!</span></button>
<button class="gift" data-team="creator" data-action="win" data-emoji="🦈"><span class="emoji">🦈</span><span class="label">VITÓRIA</span><span class="points">+1 VITÓRIA</span></button>
<button class="gift negative" data-team="creator" data-action="lose" data-emoji="🌠"><span class="emoji">🌠</span><span class="label">TIRAR</span><span class="points">−1 VITÓRIA</span></button></div></div>
<div class="towers"><div class="tower r" id="chatTower"><div class="roof"></div><div class="blocks" id="chatBlocks"></div></div><div class="tower b" id="creatorTower"><div class="roof"></div><div class="blocks" id="creatorBlocks"></div></div></div><div class="bubbles" id="bubbles"></div><div class="feed" id="feed">Aguardando eventos da LIVE…</div></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const s={chat:0,creator:0,chatWins:0,creatorWins:0,seconds:600,paused:false,ended:false,double:false};let socket=null,feedTimer=null;
function announce(t){$('feed').textContent=t;clearTimeout(feedTimer);feedTimer=setTimeout(()=>$('feed').textContent='Aguardando eventos da LIVE…',4500)}
function status(t,ok=false){$('status').textContent=t;$('status').classList.toggle('ok',ok);$('status').classList.toggle('bad',!ok)}
function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function floatEmoji(team,emoji){const e=document.createElement('span');e.className='bubble';if(typeof emoji==='string'&&/^https:\/\//i.test(emoji)){const img=document.createElement('img');img.src=emoji;img.alt='Presente TikTok';img.style.cssText='width:44px;height:44px;object-fit:contain';e.appendChild(img)}else e.textContent=emoji||'✨';e.style.left=(team==='chat'?12+Math.random()*28:60+Math.random()*28)+'%';e.style.top=(55+Math.random()*30)+'%';$('bubbles').appendChild(e);setTimeout(()=>e.remove(),2700)}
function render(){$('chatScore').textContent=s.chat.toLocaleString('pt-BR');$('creatorScore').textContent=s.creator.toLocaleString('pt-BR');$('chatWins').textContent=s.chatWins;$('creatorWins').textContent=s.creatorWins;$('timer').textContent=fmt(s.seconds);const total=Math.max(s.chat,s.creator,1);$('chatTower').style.setProperty('--h',(18+s.chat/total*65)+'%');$('creatorTower').style.setProperty('--h',(18+s.creator/total*65)+'%');$('progress').style.width=(s.double?Math.min(100,25+(s.chat+s.creator)%300/4):0)+'%';['chat','creator'].forEach(t=>{const el=$(t+'Blocks');el.innerHTML='';const n=Math.min(22,Math.max(3,Math.ceil(s[t]/10)));for(let i=0;i<n;i++){const b=document.createElement('div');b.className='block';el.appendChild(b)}})}
function score(team,points,reason,emoji){if(s.ended)return;let n=Math.round(Number(points)||0);if(s.double&&n>0)n*=2;s[team]=Math.max(0,s[team]+n);if(emoji)floatEmoji(team,emoji);announce((team==='chat'?'🔴 CHAT':'🔵 CREATOR')+' • '+reason+(n?' ('+(n>0?'+':'')+n+')':''));render()}
function finish(){if(s.ended)return;s.ended=true;s.paused=true;if(s.chat>s.creator){s.chatWins++;announce('🏆 CHAT venceu a rodada!')}else if(s.creator>s.chat){s.creatorWins++;announce('🏆 CREATOR venceu a rodada!')}else announce('🤝 Rodada empatada!');$('pauseBtn').textContent='▶';render()}
function reset(){s.chat=0;s.creator=0;s.seconds=600;s.paused=false;s.ended=false;s.double=Boolean(window.__doubleActive);$('pauseBtn').textContent='Ⅱ';announce('🔄 Nova rodada — 10 minutos');render()}
document.querySelectorAll('.gift').forEach(b=>b.addEventListener('click',()=>{const t=b.dataset.team,op=t==='chat'?'creator':'chat',emoji=b.dataset.emoji;if(b.dataset.action==='win'){s[t+'Wins']++;announce('🏆 Vitória adicionada para '+t.toUpperCase());render();return}if(b.dataset.action==='lose'){s[op+'Wins']=Math.max(0,s[op+'Wins']-1);announce('🛑 Vitória removida do adversário '+op.toUpperCase());render();return}const n=Number(b.dataset.points)||0;if(n===0){s[op]=0;floatEmoji(op,emoji);announce('💥 Torre adversária '+op.toUpperCase()+' zerada!');render();return}if(n===25){const stolen=Math.min(25,s[op]);s[op]-=stolen;s[t]+=stolen;floatEmoji(t,emoji);announce((t==='chat'?'🔴 CHAT':'🔵 CREATOR')+' roubou '+stolen+' pontos de '+op.toUpperCase());render();return}if(n<0){score(op,n,'ataque recebido do '+t.toUpperCase(),emoji);return}score(t,n,'presente de teste',emoji)}));
$('pauseBtn').addEventListener('click',()=>{if(s.ended){reset();return}s.paused=!s.paused;$('pauseBtn').textContent=s.paused?'▶':'Ⅱ';announce(s.paused?'Jogo pausado':'Jogo retomado')});$('resetBtn').addEventListener('click',reset);$('viewBtn').addEventListener('click',()=>{$('game').style.filter=$('game').style.filter?'':'saturate(1.25)';announce('Efeito visual alternado')});
setInterval(()=>{if(s.paused||s.ended)return;if(s.seconds>0)s.seconds--;if(s.seconds<=0)finish();else render()},1000);
const multi=$('multi');function showDouble(){s.double=true;window.__doubleActive=true;multi.style.display='block';announce('⚡ 2X TUDO ATIVADO por 30 segundos!');render();setTimeout(()=>{s.double=false;window.__doubleActive=false;multi.style.display='none';announce('2X TUDO encerrado');render()},30000)}setInterval(showDouble,300000);
function connect(){if(typeof window.io!=='function'){status('Socket.IO indisponível');return}socket=window.io({reconnection:true,timeout:10000});socket.on('connect',()=>announce('Conectado ao servidor do jogo'));socket.on('disconnect',()=>status('Servidor desconectado'));socket.on('connect_error',()=>status('Falha no servidor'));socket.on('connection-status',d=>status(d?.message||'Status desconhecido',Boolean(d?.connected)));socket.on('server-ready',d=>{if(d?.username)announce('Monitorando @'+d.username)});socket.on('chat',d=>{const u=String(d?.user||'Espectador').slice(0,35),m=String(d?.comment||'').slice(0,100),t=/\b(creator|criador|azul)\b/i.test(m)?'creator':'chat';score(t,1,'💬 @'+u,'💬')});socket.on('gift',d=>{const u=String(d?.user||'Fã').slice(0,35),name=String(d?.giftName||'Presente').slice(0,40),diamonds=Math.min(1000,Math.max(1,Number(d?.diamondCount)||1)),repeat=Math.min(100,Math.max(1,Number(d?.repeatCount)||1));const img=typeof d?.giftImageUrl==='string'&&/^https:\/\//i.test(d.giftImageUrl)?d.giftImageUrl:null;score('creator',diamonds*repeat,'🎁 '+name+' de @'+u,img||'🎁')});socket.on('like',d=>announce('❤️ Curtidas de @'+String(d?.user||'espectador').slice(0,30)));socket.on('follow',d=>announce('➕ Novo seguidor: @'+String(d?.user||'espectador').slice(0,30)));socket.on('share',d=>announce('↗️ Compartilhamento de @'+String(d?.user||'espectador').slice(0,30)));socket.on('member',d=>announce('👋 Entrou: @'+String(d?.user||'espectador').slice(0,30)))}
render();connect()})();
</script></body></html>
