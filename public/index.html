<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080911">
<title>Torre Live — Chat vs Creator</title>
<script src="/socket.io/socket.io.js"></script>
<style>
:root{color-scheme:dark;--red:#ff335b;--blue:#00c8ff;--bg:#080911;--panel:rgba(10,14,28,.88)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060d;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
button{font:inherit;touch-action:manipulation;cursor:pointer}
.game{position:relative;width:100%;height:100%;max-width:520px;margin:auto;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#20234b 0,#0b0d20 45%,#05060d 100%)}
#arena{position:absolute;inset:0;width:100%;height:100%}
.ui{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:none;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
header,.scores,.controls,.feed,.bottom{pointer-events:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 2px}
.brand{font-weight:900;letter-spacing:.8px;font-size:13px}
.status{font-size:10px;border:1px solid #565b72;background:#171a2c;border-radius:999px;padding:6px 9px;max-width:65%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status.ok{border-color:#24d982;color:#74ffc0}.status.bad{border-color:#ff5574;color:#ff9caf}
.scores{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;margin-top:3px}
.team{padding:8px 4px;border-radius:14px;background:var(--panel);border:1px solid #383c58;box-shadow:0 8px 22px #0005}
.team.red{border-color:#8e2944}.team.blue{border-color:#17617b}
.team-name{font-size:11px;letter-spacing:1.5px;font-weight:900}.red .team-name{color:var(--red)}.blue .team-name{color:var(--blue)}
.score{font-size:clamp(28px,9vw,44px);line-height:1.15;font-weight:950;font-variant-numeric:tabular-nums}
.vs{font-size:13px;font-weight:950;color:#ffe36c;text-shadow:0 0 12px #ffe36c}
.subrow{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:#d4d8f2;margin:8px 2px}
.pill{background:#101326d9;border:1px solid #333852;border-radius:999px;padding:5px 8px}
.timer{font-variant-numeric:tabular-nums;font-weight:900;color:#fff}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto;margin-bottom:8px}
.team-controls{background:#0a0d1bdc;border:1px solid #303651;border-radius:14px;padding:8px}
.team-controls h3{font-size:11px;margin:0 0 7px;letter-spacing:1px}
.team-controls.red h3{color:var(--red)}.team-controls.blue h3{color:var(--blue)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btns button,.bottom button{border:1px solid #434968;border-radius:9px;background:#1a1e35;color:white;padding:9px 4px;font-size:11px;font-weight:800}
.btns button:active,.bottom button:active{transform:scale(.97);filter:brightness(1.3)}
.btns .up{border-color:#257c5c}.btns .down{border-color:#84384d}
.feed{background:#080b18e8;border:1px solid #292e47;border-radius:12px;padding:8px 10px;margin-bottom:8px;min-height:56px;max-height:90px;overflow:hidden}
.feed-title{font-size:10px;color:#9ea6c8;letter-spacing:1px;margin-bottom:4px}
#events{font-size:11px;line-height:1.45;color:#e8eaff;overflow-wrap:anywhere}
.bottom{display:flex;gap:7px;margin-bottom:6px}.bottom button{flex:1;padding:9px 4px}
.note{text-align:center;font-size:9px;color:#8d93b3;padding:0 0 3px}
@media(min-height:780px){.controls{margin-bottom:16px}.team-controls{padding:10px}.btns button{padding:11px 4px}.feed{max-height:100px}}
</style>
</head>
<body>
<div class="game">
<canvas id="arena" aria-label="Arena de torres do jogo"></canvas>
<div class="ui">
<header>
<div class="brand">⚔️ TORRE LIVE</div>
<div id="status" class="status">Conectando ao servidor…</div>
</header>
<section class="scores" aria-label="Placar">
<div class="team red"><div class="team-name">CHAT</div><div id="chatScore" class="score">0</div></div>
<div class="vs">VS</div>
<div class="team blue"><div class="team-name">CREATOR</div><div id="creatorScore" class="score">0</div></div>
</section>
<div class="subrow"><span class="pill">🏆 Vitórias: <b id="chatWins">0</b> — <b id="creatorWins">0</b></span><span class="pill">⏱️ <span id="timer" class="timer">10:00</span></span></div>
<div class="controls">
<section class="team-controls red"><h3>🔴 CHAT</h3><div class="btns">
<button class="up" data-team="chat" data-action="add" data-points="1">+1 teste</button>
<button class="up" data-team="chat" data-action="add" data-points="10">+10 teste</button>
<button class="down" data-team="chat" data-action="sub" data-points="5">−5 teste</button>
<button data-team="chat" data-action="win">🏆 Vitória</button>
</div></section>
<section class="team-controls blue"><h3>🔵 CREATOR</h3><div class="btns">
<button class="up" data-team="creator" data-action="add" data-points="1">+1 teste</button>
<button class="up" data-team="creator" data-action="add" data-points="10">+10 teste</button>
<button class="down" data-team="creator" data-action="sub" data-points="5">−5 teste</button>
<button data-team="creator" data-action="win">🏆 Vitória</button>
</div></section>
</div>
<section class="feed"><div class="feed-title">EVENTOS DA LIVE</div><div id="events">Aguardando chat e presentes…</div></section>
<div class="bottom"><button id="pauseBtn">⏸ Pausar</button><button id="resetBtn">↻ Nova rodada</button></div>
<div class="note">Teste manual serve para conferir o jogo; eventos reais dependem da conexão TikTok.</div>
</div>
</div>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const state = { chat:0, creator:0, chatWins:0, creatorWins:0, seconds:600, paused:false, roundEnded:false };
const statusEl = $('status');
const canvas = $('arena');
const ctx = canvas.getContext('2d');
let width = 0, height = 0, dpr = 1, animationId = 0;
let socket = null;
let timerInterval = null;
const recentEvents = [];

function setStatus(message, ok=false) {
  statusEl.textContent = message;
  statusEl.classList.toggle('ok', ok);
  statusEl.classList.toggle('bad', !ok);
}
function addEvent(message) {
  recentEvents.unshift(message);
  recentEvents.splice(4);
  $('events').innerHTML = recentEvents.map(text => '<div></div>').join('');
  [...$('events').children].forEach((el, i) => { el.textContent = recentEvents[i]; });
}
function renderScores() {
  $('chatScore').textContent = state.chat.toLocaleString('pt-BR');
  $('creatorScore').textContent = state.creator.toLocaleString('pt-BR');
  $('chatWins').textContent = state.chatWins;
  $('creatorWins').textContent = state.creatorWins;
  draw();
}
function addScore(team, points, reason) {
  if (state.roundEnded || !['chat','creator'].includes(team)) return;
  const key = team === 'chat' ? 'chat' : 'creator';
  state[key] = Math.max(0, state[key] + Math.round(points));
  addEvent((team === 'chat' ? '🔴 ' : '🔵 ') + reason + ' (+' + Math.round(points) + ')');
  renderScores();
}
function finishRound() {
  if (state.roundEnded) return;
  state.roundEnded = true;
  if (state.chat === state.creator) addEvent('⏱️ Rodada empatada!');
  else if (state.chat > state.creator) { state.chatWins++; addEvent('🏆 CHAT venceu a rodada!'); }
  else { state.creatorWins++; addEvent('🏆 CREATOR venceu a rodada!'); }
  $('pauseBtn').textContent = '▶ Continuar';
  state.paused = true;
  renderScores();
}
function formatTime(seconds) {
  const m = Math.floor(seconds / 60), s = seconds % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function renderTimer() { $('timer').textContent = formatTime(state.seconds); }
function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (state.paused || state.roundEnded) return;
    if (state.seconds > 0) state.seconds--;
    renderTimer();
    if (state.seconds <= 0) finishRound();
  }, 1000);
}
function resetRound() {
  state.chat = 0; state.creator = 0; state.seconds = 600;
  state.paused = false; state.roundEnded = false;
  $('pauseBtn').textContent = '⏸ Pausar';
  recentEvents.length = 0;
  addEvent('🔄 Nova rodada iniciada — 10 minutos.');
  renderTimer(); renderScores();
}
document.querySelectorAll('[data-team]').forEach(button => {
  button.addEventListener('click', () => {
    const team = button.dataset.team, action = button.dataset.action;
    if (action === 'win') {
      if (team === 'chat') state.chatWins++; else state.creatorWins++;
      addEvent('🏆 Vitória de teste para ' + team.toUpperCase());
      renderScores(); return;
    }
    const points = Number(button.dataset.points) || 0;
    addScore(team, action === 'sub' ? -points : points, 'Teste manual');
  });
});
$('pauseBtn').addEventListener('click', () => {
  if (state.roundEnded) { resetRound(); return; }
  state.paused = !state.paused;
  $('pauseBtn').textContent = state.paused ? '▶ Continuar' : '⏸ Pausar';
});
$('resetBtn').addEventListener('click', resetRound);

function connectSocket() {
  if (typeof window.io !== 'function') {
    setStatus('Servidor sem Socket.IO');
    addEvent('Não foi possível carregar Socket.IO.');
    return;
  }
  socket = window.io({ reconnection: true, reconnectionAttempts: Infinity, timeout: 10000 });
  socket.on('connect', () => addEvent('Conectado ao servidor do jogo.'));
  socket.on('disconnect', () => setStatus('Servidor desconectado'));
  socket.on('connect_error', () => setStatus('Falha ao acessar servidor'));
  socket.on('connection-status', data => setStatus(data?.message || 'Status desconhecido', Boolean(data?.connected)));
  socket.on('server-ready', data => { if (data?.username) addEvent('Monitorando @' + data.username); });
  socket.on('chat', data => {
    const user = String(data?.user || 'Espectador').slice(0,40);
    const comment = String(data?.comment || '').slice(0,180);
    addEvent('💬 @' + user + ': ' + comment);
    const text = comment.toLowerCase();
    if (/\b(creator|criador|azul)\b/.test(text)) addScore('creator', 1, 'Comentário de @' + user);
    else addScore('chat', 1, 'Comentário de @' + user);
  });
  socket.on('gift', data => {
    const user = String(data?.user || 'Fã').slice(0,40);
    const gift = String(data?.giftName || 'Presente').slice(0,50);
    const diamonds = Math.max(1, Math.min(1000, Number(data?.diamondCount) || 1));
    const repeats = Math.max(1, Math.min(100, Number(data?.repeatCount) || 1));
    addScore('creator', Math.min(1000, diamonds * repeats), '🎁 ' + gift + ' de @' + user);
  });
  socket.on('like', data => addEvent('❤️ Curtidas de @' + String(data?.user || 'espectador').slice(0,35) + ' (não pontua)'));
  socket.on('follow', data => addEvent('➕ Novo seguidor: @' + String(data?.user || 'espectador').slice(0,35)));
  socket.on('share', data => addEvent('↗️ Live compartilhada por @' + String(data?.user || 'espectador').slice(0,35)));
  socket.on('member', data => addEvent('👋 Entrou: @' + String(data?.user || 'espectador').slice(0,35)));
}
function resize() {
  const rect = canvas.getBoundingClientRect();
  dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  width = rect.width; height = rect.height;
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
function polygon(points, fill, stroke) {
  ctx.beginPath(); points.forEach((p,i) => i ? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1]));
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke(); }
}
function tower(cx, base, score, main, dark, light) {
  const towerHeight = Math.min(height * .42, 48 + Math.log2(score + 1) * 15);
  const blockH = 13, frontW = Math.min(66, width * .17), side = 12;
  for (let y = 0; y < towerHeight; y += blockH) {
    const by = base - y - blockH;
    polygon([[cx-frontW/2,by],[cx-frontW/2+side,by-7],[cx+frontW/2+side,by-7],[cx+frontW/2,by]],light,'#070913');
    polygon([[cx+frontW/2,by],[cx+frontW/2+side,by-7],[cx+frontW/2+side,by+blockH-7],[cx+frontW/2,by+blockH]],dark,'#070913');
    ctx.fillStyle = main; ctx.fillRect(cx-frontW/2,by,frontW,blockH);
    ctx.strokeStyle = '#070913'; ctx.lineWidth = 1.5; ctx.strokeRect(cx-frontW/2,by,frontW,blockH);
  }
}
function draw() {
  if (!ctx || !width || !height) return;
  ctx.clearRect(0,0,width,height);
  const horizon = height * .47;
  const sky = ctx.createLinearGradient(0,0,0,height);
  sky.addColorStop(0,'#10142c'); sky.addColorStop(.58,'#25234d'); sky.addColorStop(1,'#080a18');
  ctx.fillStyle=sky;ctx.fillRect(0,0,width,height);
  ctx.fillStyle='#ff4e85';ctx.shadowColor='#ff4e85';ctx.shadowBlur=22;
  ctx.beginPath();ctx.arc(width/2,horizon-20,Math.min(width*.16,58),0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  ctx.save();ctx.beginPath();ctx.rect(0,horizon,width,height-horizon);ctx.clip();
  for(let i=0;i<10;i++){
    const y=horizon+i*i*2.8;ctx.strokeStyle='rgba(0,220,255,'+(0.12+i*.012)+')';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(width,y);ctx.stroke();
  }
  for(let i=-10;i<=10;i++){
    ctx.strokeStyle='rgba(0,220,255,.22)';ctx.beginPath();ctx.moveTo(width/2,horizon);ctx.lineTo(width/2+i*width*.12,height);ctx.stroke();
  }
  ctx.restore();
  const base=height*.79;
  tower(width*.29,base,state.chat,'#ff335b','#9c1839','#ff9ab0');
  tower(width*.71,base,state.creator,'#00c8ff','#00668d','#a2efff');
  ctx.fillStyle='#070914';ctx.fillRect(0,base,width,height-base);
  ctx.strokeStyle='#5a628e';ctx.beginPath();ctx.moveTo(0,base);ctx.lineTo(width,base);ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 10px system-ui';ctx.textAlign='center';
  ctx.fillText('CHAT',width*.29,base+17);ctx.fillText('CREATOR',width*.71,base+17);
}
window.addEventListener('resize', resize);
resize(); renderTimer(); renderScores(); startTimer(); connectSocket();
})();
</script>
</body>
</html>
